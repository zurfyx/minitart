<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- minitart's mark: a Mac mini with a screen rising from it, a prompt on the screen. One
       colour; the prompt, the light and the gap between the two are cut out. docs/design.md. -->
  <style>g { fill: #b3214a } @media (prefers-color-scheme: dark) { g { fill: #f0688c } }</style>
  <defs>
    <rect id="base" x="3" y="17.7" width="26" height="10.4" rx="3.4"/>
    <mask id="screen" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#base" fill="#000" stroke="#000" stroke-width="1.8"/>
      <path d="M12.7 8.1L15.1 10.2L12.7 12.3M16.6 12.3H19.4" fill="none" stroke="#000" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <mask id="light" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="21.6" y="22.3" width="3.6" height="1.7" rx="0.85" fill="#000"/>
    </mask>
  </defs>
  <g>
    <rect x="7.2" y="3.9" width="17.6" height="14.4" rx="3" mask="url(#screen)"/>
    <use href="#base" mask="url(#light)"/>
  </g>
</svg>
