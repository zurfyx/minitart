# Dependabot proposes GitHub Actions bumps only; CI gates them like any other pull request
# (D12). npm updates are made by hand: they are development tools only (D07), and a bump is
# worth reading. A cooldown leaves each action release a week to be yanked or flagged before
# it is proposed.
version: 2
updates:
  # The sha-pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: Bump
