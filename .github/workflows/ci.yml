name: CI

# The merge gate (D12). static and test are required status checks on main; rename one only
# together with the branch protection rule.
# Nothing here deploys and no job holds a credential: Vercel's Git integration deploys the
# website (D15). Every job runs on GitHub's hosted runners, never on minitart: this repo is
# public (D05).
#
# Every action is pinned to a full commit sha, with its version in a comment; Dependabot
# (.github/dependabot.yml) proposes the bumps. zizmor audits this directory on every run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm format:check
        if: ${{ !cancelled() }}

  test:
    # Separate from static so a formatting nit never masks a real failure. No VM and no
    # network: the manager runs against a GitHub and a Tart in memory (docs/testing.md).
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  zizmor:
    # Static analysis of the workflows and dependabot.yml (template injection, unpinned
    # actions, excessive permissions, credential persistence). Findings fail the job and
    # print in its log; nothing is uploaded, so the job needs no security-events permission.
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: pedantic
          # zizmor itself, pinned like the actions; bump it with the action.
          version: 1.31.1
