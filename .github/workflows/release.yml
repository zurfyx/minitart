name: Release

# Every push to main is a candidate release (D16, docs/release.md). Nobody chooses a version
# or edits one: scripts/release.mjs takes the next patch number after the highest tag, and
# does nothing when what ships has not changed.
#
#   check     the same gate as CI, on this very commit
#   release   packs the archive from a clean checkout, tags it, publishes it
#   tap       makes the Homebrew tap's formula match the newest release
#
# Only from main: started by hand on another branch, every job is skipped.
#
# The tap job acts as a GitHub App (the release bot), because a pull request opened with this
# workflow's own token would not start the tap's CI. It is skipped until the App is set up
# (the RELEASE_APP_ID variable), and running the workflow by hand afterwards catches up.
#
# Every action is pinned to a full commit sha; zizmor audits this file in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # The same gate as CI, on the commit being released. Its own job: the tools it installs
    # never touch the tree that is packed, and never hold a token that can publish.
    name: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  release:
    # A fresh checkout and Node, nothing installed: what is packed is what is in git.
    name: release
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the tag and the release
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan compares against every earlier release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        run: node scripts/release.mjs plan
      - if: steps.plan.outputs.action == 'publish'
        run: node scripts/release.mjs pack "$VERSION" dist
        env:
          VERSION: ${{ steps.plan.outputs.version }}
      - if: steps.plan.outputs.action == 'publish'
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "minitart $VERSION" \
            --generate-notes \
            "dist/minitart-$VERSION.tar.gz" "dist/minitart-$VERSION.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}

  tap:
    # Not only after a publish: it brings the tap up to the newest release whenever it is
    # behind, so a run that failed halfway, or the App being set up later, loses nothing.
    name: tap
    needs: release
    if: github.ref == 'refs/heads/main' && vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: zurfyx
          repositories: homebrew-tap
          # Only what proposing and merging the formula takes, on the tap alone.
          permission-contents: write
          permission-pull-requests: write
      - run: sh scripts/update-tap.sh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
